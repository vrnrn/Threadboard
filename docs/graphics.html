<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threadboard — social preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .social-card { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #111; color: #e8e8e8; }
    .identity { position: absolute; top: 48px; left: 52px; display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; letter-spacing: -.7px; }
    .identity img { width: 48px; height: 48px; }
    .copy { position: absolute; top: 170px; left: 52px; width: 395px; }
    h1 { margin: 0 0 26px; font-size: 64px; font-weight: 600; line-height: 1.08; letter-spacing: -2.7px; }
    p { margin: 0; max-width: 300px; color: #969696; font-size: 23px; line-height: 1.5; }
    .features { position: absolute; left: 54px; bottom: 53px; display: flex; flex-direction: column; gap: 12px; color: #858585; font-size: 15px; }
    .features span::before { content: ""; display: inline-block; width: 5px; height: 5px; background: #777; border-radius: 50%; margin-right: 10px; vertical-align: 3px; }
    .product { position: absolute; left: 485px; top: 126px; width: 1070px; padding: 10px; border: 1px solid #333; border-radius: 20px; background: #1a1a1a; box-shadow: 0 28px 70px #0008; }
    .product img { display: block; width: 100%; height: auto; border-radius: 11px; }
    .url { position: absolute; top: 64px; right: 52px; color: #747474; font-size: 15px; letter-spacing: .1px; }
  </style>
</head>
<body>
  <main class="social-card" aria-label="Threadboard product preview">
    <div class="identity"><img src="../plugins/threadboard/assets/logo.svg" alt=""><span>Threadboard</span></div>
    <div class="copy"><h1>Task boards.<br>Inside Codex.</h1><p>Local boards for your Codex projects.</p></div>
    <div class="features"><span>Multiple boards per project</span><span>Lightweight live updates</span><span>Stored on your device</span></div>
    <div class="product"><img src="images/board-dark.png" alt="The Product board with tasks across five columns"></div>
    <div class="url">threadboard.vrnrn.com</div>
  </main>
</body>
</html>
