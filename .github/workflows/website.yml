name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'docs/**', 'plugins/threadboard/**', 'scripts/**', '*.json', '*.md', 'LICENSE', '.agents/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['site/**', 'src/**', 'docs/**', 'plugins/threadboard/**', 'scripts/**', '*.json', '*.md', 'LICENSE', '.agents/**', '.github/workflows/website.yml']
permissions:
  contents: read
concurrency:
  group: threadboard-website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
