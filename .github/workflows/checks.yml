name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run benchmark
      - run: npm run benchmark:startup
      - run: npm run benchmark:concurrency
      - run: npm run benchmark:populated
      - run: npm run benchmark:ui
      - run: npm run release:check
      - run: npm run release:pack
      - run: npm install --global @openai/codex@0.157.1
      - run: npm run test:install
      - uses: actions/upload-artifact@v4
        with:
          name: threadboard-node-${{ matrix.node }}
          path: |
            release/threadboard-*.zip
            release/SHA256SUMS
